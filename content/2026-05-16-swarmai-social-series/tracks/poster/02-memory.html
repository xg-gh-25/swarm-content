<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwarmAI — Memory Compounds</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'PingFang SC';
    src: local('PingFang SC');
  }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'PingFang SC', -apple-system, 'Noto Sans SC', sans-serif;
  }

  .poster {
    width: 1080px;
    height: 1080px;
    background: #0D1117;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
  }

  /* Subtle visual — concentric arcs suggesting depth/continuity */
  .visual-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .arc {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(212, 168, 83, 0.06);
  }

  .arc-1 {
    width: 900px;
    height: 900px;
    top: -200px;
    right: -300px;
  }

  .arc-2 {
    width: 700px;
    height: 700px;
    top: -100px;
    right: -200px;
  }

  .arc-3 {
    width: 500px;
    height: 500px;
    top: 0px;
    right: -100px;
  }

  .arc-4 {
    width: 300px;
    height: 300px;
    top: 100px;
    right: 0px;
  }

  /* Gradient overlay for depth */
  .gradient-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    background: linear-gradient(to top, rgba(27, 40, 56, 0.3) 0%, transparent 100%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .hero {
    font-size: 72px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.3;
    margin-bottom: 48px;
    letter-spacing: 2px;
  }

  .body-text {
    font-size: 32px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.8;
    margin-bottom: 80px;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: rgba(212, 168, 83, 0.4);
    margin-bottom: 32px;
  }

  .footer {
    position: absolute;
    bottom: 80px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .tagline {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 24px;
    font-weight: 500;
    color: #D4A853;
    letter-spacing: 0.5px;
  }

  .brand-mark {
    font-size: 20px;
    color: rgba(212, 168, 83, 0.7);
  }
</style>
</head>
<body>
<div class="poster">

  <!-- Visual: concentric arcs suggesting accumulation/depth -->
  <div class="visual-layer">
    <div class="arc arc-1"></div>
    <div class="arc arc-2"></div>
    <div class="arc arc-3"></div>
    <div class="arc arc-4"></div>
  </div>

  <div class="gradient-overlay"></div>

  <div class="content">
    <h1 class="hero">没有记忆就没有理解。</h1>

    <div class="body-text">
      记忆不是存储，是连续性。<br>
      有连续性才有理解，<br>
      有理解才有信任，<br>
      有信任才有深度协作。<br>
      <br>
      越用越懂你，才叫 compound。
    </div>
  </div>

  <div class="footer">
    <div>
      <div class="divider"></div>
      <div class="tagline">Human directs. AI delivers.</div>
    </div>
    <div class="brand-mark">🐝 SwarmAI</div>
  </div>

</div>
</body>
</html>
